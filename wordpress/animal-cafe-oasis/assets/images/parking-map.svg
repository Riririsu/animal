<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1340" width="800" height="1340"
     role="img" aria-labelledby="pm-title pm-desc" font-family="'Zen Kaku Gothic New','Hiragino Sans','Noto Sans JP',sans-serif">
  <title id="pm-title">第二駐車場のお知らせ</title>
  <desc id="pm-desc">満車時は「薩摩味処 喰宴（くうえん）」駐車場をご利用ください。Oasis から国分中央高等学校の前を北へ進み、信号を越えて踏切を渡り、すぐ左折した右側にあります。</desc>

  <rect width="800" height="1340" fill="#ffffff"/>

  <!-- 見出し帯 -->
  <rect x="0" y="0" width="800" height="318" fill="#43915E"/>
  <text x="400" y="140" fill="#fff" font-size="112" font-weight="800" text-anchor="middle" letter-spacing="6">第二駐車場</text>
  <text x="400" y="272" fill="#fff" font-size="112" font-weight="800" text-anchor="middle" letter-spacing="6">のお知らせ</text>

  <!-- ===== 地図 ===== -->
  <g id="roads" fill="#BFBFBF">
    <!-- 縦の道 -->
    <rect x="258" y="330" width="36" height="830"/>
    <!-- 上の横道 -->
    <rect x="22" y="478" width="478" height="28"/>
    <!-- 下の横道 -->
    <rect x="22" y="940" width="478" height="28"/>
  </g>
  <!-- 右上からの斜めの道 -->
  <path d="M497 344 L292 474" stroke="#BFBFBF" stroke-width="26" fill="none"/>
  <!-- 左からの斜めの道（喰宴へ入る道） -->
  <path d="M24 706 L268 772" stroke="#BFBFBF" stroke-width="24" fill="none"/>

  <!-- 向花五差路 -->
  <text x="276" y="452" font-size="30" font-weight="700" fill="#1a1a1a" text-anchor="middle">向花五差路</text>
  <g id="signal-1">
    <rect x="214" y="470" width="126" height="44" rx="22" fill="#fff" stroke="#3a3a3a" stroke-width="3"/>
    <circle cx="245" cy="492" r="14" fill="#5BB7E5"/>
    <circle cx="277" cy="492" r="14" fill="#F4E04D"/>
    <circle cx="309" cy="492" r="14" fill="#DE5A9D"/>
  </g>

  <!-- 喰宴の駐車場 -->
  <g id="kuen">
    <circle cx="146" cy="700" r="28" fill="#1560A8"/>
    <text x="146" y="713" font-size="40" font-weight="800" fill="#fff" text-anchor="middle">P</text>
    <rect x="180" y="686" width="92" height="50" fill="#fff" stroke="#DD2222" stroke-width="4"/>
    <text x="226" y="723" font-size="36" font-weight="700" fill="#DD2222" text-anchor="middle">喰宴</text>
  </g>

  <!-- 経路の赤矢印 -->
  <g id="arrows" fill="#DD2222">
    <path d="M170 772 l0 -28 -9 0 15 -22 15 22 -9 0 0 28 z"/>
    <path d="M266 784 l0 -28 -9 0 15 -22 15 22 -9 0 0 28 z"/>
    <path d="M270 906 l0 -44 -11 0 18 -26 18 26 -11 0 0 44 z"/>
    <path d="M270 1066 l0 -44 -11 0 18 -26 18 26 -11 0 0 44 z"/>
  </g>

  <!-- 踏切 -->
  <g id="crossing">
    <rect x="22" y="788" width="478" height="18" fill="#1a1a1a"/>
    <g fill="#ffffff">
      <rect x="36" y="792" width="18" height="10"/><rect x="72" y="792" width="18" height="10"/>
      <rect x="108" y="792" width="18" height="10"/><rect x="144" y="792" width="18" height="10"/>
      <rect x="180" y="792" width="18" height="10"/><rect x="216" y="792" width="18" height="10"/>
      <rect x="252" y="792" width="18" height="10"/><rect x="288" y="792" width="18" height="10"/>
      <rect x="324" y="792" width="18" height="10"/><rect x="360" y="792" width="18" height="10"/>
      <rect x="396" y="792" width="18" height="10"/><rect x="432" y="792" width="18" height="10"/>
      <rect x="468" y="792" width="18" height="10"/>
    </g>
  </g>

  <!-- 下の信号 -->
  <g id="signal-2">
    <rect x="226" y="936" width="106" height="40" rx="20" fill="#fff" stroke="#3a3a3a" stroke-width="3"/>
    <circle cx="252" cy="956" r="12" fill="#5BB7E5"/>
    <circle cx="279" cy="956" r="12" fill="#F4E04D"/>
    <circle cx="306" cy="956" r="12" fill="#DE5A9D"/>
  </g>

  <!-- 目印 -->
  <g id="landmarks">
    <rect x="108" y="1052" width="150" height="64" fill="#2E7D4E"/>
    <text x="183" y="1101" font-size="44" font-weight="700" fill="#fff" text-anchor="middle"
          font-family="'Shippori Mincho',serif">Oasis</text>

    <rect x="316" y="1028" width="152" height="92" fill="#D9D9D9"/>
    <text x="392" y="1068" font-size="28" font-weight="500" fill="#1a1a1a" text-anchor="middle">国分中央</text>
    <text x="392" y="1102" font-size="28" font-weight="500" fill="#1a1a1a" text-anchor="middle">高等学校</text>
  </g>

  <!-- 下部の赤帯 -->
  <rect x="22" y="1204" width="524" height="56" fill="#DD2222"/>
  <text x="284" y="1244" font-size="32" font-weight="700" fill="#fff" text-anchor="middle">踏切渡ってすぐ左折後右側</text>

  <!-- ===== 右側の縦書き（1文字ずつ配置） ===== -->
  <g>
    <text x="712" y="402" font-size="70" font-weight="800" fill="#1a1a1a" text-anchor="middle">満</text>
    <text x="712" y="480" font-size="70" font-weight="800" fill="#1a1a1a" text-anchor="middle">車</text>
    <text x="712" y="558" font-size="70" font-weight="800" fill="#1a1a1a" text-anchor="middle">時</text>
    <text x="712" y="636" font-size="70" font-weight="800" fill="#1a1a1a" text-anchor="middle">は</text>
    <text x="712" y="714" font-size="70" font-weight="800" fill="#1a1a1a" text-anchor="middle" transform="rotate(90 712 690)">「</text>
    <text x="712" y="792" font-size="70" font-weight="800" fill="#1a1a1a" text-anchor="middle">薩</text>
    <text x="712" y="870" font-size="70" font-weight="800" fill="#1a1a1a" text-anchor="middle">摩</text>
    <text x="712" y="948" font-size="70" font-weight="800" fill="#1a1a1a" text-anchor="middle">味</text>
    <text x="712" y="1026" font-size="70" font-weight="800" fill="#1a1a1a" text-anchor="middle">処</text>
    <text x="712" y="1104" font-size="70" font-weight="800" fill="#1a1a1a" text-anchor="middle">喰</text>
    <text x="712" y="1182" font-size="70" font-weight="800" fill="#1a1a1a" text-anchor="middle">宴</text>
    <text x="712" y="1260" font-size="70" font-weight="800" fill="#1a1a1a" text-anchor="middle" transform="rotate(90 712 1236)">」</text>
    <text x="606" y="402" font-size="70" font-weight="800" fill="#1a1a1a" text-anchor="middle">駐</text>
    <text x="606" y="480" font-size="70" font-weight="800" fill="#1a1a1a" text-anchor="middle">車</text>
    <text x="606" y="558" font-size="70" font-weight="800" fill="#1a1a1a" text-anchor="middle">場</text>
    <text x="606" y="636" font-size="70" font-weight="800" fill="#1a1a1a" text-anchor="middle">を</text>
    <text x="606" y="714" font-size="70" font-weight="800" fill="#1a1a1a" text-anchor="middle">ご</text>
    <text x="606" y="792" font-size="70" font-weight="800" fill="#1a1a1a" text-anchor="middle">利</text>
    <text x="606" y="870" font-size="70" font-weight="800" fill="#1a1a1a" text-anchor="middle">用</text>
    <text x="606" y="948" font-size="70" font-weight="800" fill="#1a1a1a" text-anchor="middle">く</text>
    <text x="606" y="1026" font-size="70" font-weight="800" fill="#1a1a1a" text-anchor="middle">だ</text>
    <text x="606" y="1104" font-size="70" font-weight="800" fill="#1a1a1a" text-anchor="middle">さ</text>
    <text x="606" y="1182" font-size="70" font-weight="800" fill="#1a1a1a" text-anchor="middle">い</text>
    <text x="627" y="1239" font-size="70" font-weight="800" fill="#1a1a1a" text-anchor="middle">。</text>
    <text x="760" y="1088" font-size="22" font-weight="500" fill="#1a1a1a" text-anchor="middle">く</text>
    <text x="760" y="1128" font-size="22" font-weight="500" fill="#1a1a1a" text-anchor="middle">う</text>
    <text x="760" y="1168" font-size="22" font-weight="500" fill="#1a1a1a" text-anchor="middle">え</text>
    <text x="760" y="1208" font-size="22" font-weight="500" fill="#1a1a1a" text-anchor="middle">ん</text>
  </g>
</svg>
