# GitHub Pages への公開
#
# このブランチに push すると、自動でサイトが公開されます。
# 公開先: https://riririsu.github.io/animal/
#
# ページが表示されない場合は、リポジトリの
# Settings → Pages → Build and deployment → Source が
# 「GitHub Actions」になっているか確認してください。

name: Deploy to GitHub Pages

on:
  push:
    branches:
      - claude/oasis-design-html-css-animation-wo4hdf
      - main
  workflow_dispatch:   # 手動でも実行できるようにする

permissions:
  contents: read
  pages: write
  id-token: write

# 公開処理が重ならないようにする（後から来たものを待たせる）
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: 公開するファイルだけを集める
        run: |
          mkdir -p _site
          cp *.html _site/
          cp -r css js images _site/
          cp robots.txt sitemap.xml _site/
          # Jekyll による自動処理を無効にする（素のHTMLをそのまま配信するため）
          touch _site/.nojekyll
          echo "--- 公開されるファイル ---"
          find _site -type f | sort

      - name: Pages の設定を読み込む
        uses: actions/configure-pages@v5

      - name: 成果物をアップロード
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: 公開
        id: deployment
        uses: actions/deploy-pages@v4
